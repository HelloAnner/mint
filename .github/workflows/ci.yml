name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新的推送会取消上一次未跑完的任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 / 测试 / 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 渲染测试会输出中文标签，装上 CJK 字体才算真正覆盖到中文这条路径
      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-list :lang=zh | head -3

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 类型检查
        run: bunx tsc --noEmit

      - name: 单元与端到端测试
        run: bun test

      - name: 编译单文件二进制
        run: bun run scripts/build.ts

      - name: 二进制自检
        run: ./dist/mint doctor
