name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        r: [release]
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      # 系统依赖：中文字体 + 图形库（ragg/svglite 需要 freetype/libpng）
      - name: 安装系统依赖（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libfontconfig1-dev fonts-noto-cjk
          fc-cache -f

      - name: 安装 R 依赖
        run: Rscript scripts/install-deps.R
        env:
          MINT_NCPUS: 2

      - name: 环境自检
        run: ./bin/mint doctor

      - name: 测试（含全部图表端到端渲染）
        run: Rscript tests/run-tests.R

      - name: 渲染全部图表示例
        run: Rscript scripts/examples.R out/examples --dpi=100

      - name: 上传预览产物
        uses: actions/upload-artifact@v4
        with:
          name: examples-${{ matrix.os }}
          path: out/examples/*.png
          if-no-files-found: error
