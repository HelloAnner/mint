name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 校验并发布
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libpng-dev libtiff5-dev libjpeg-dev \
            libfontconfig1-dev fonts-noto-cjk
          fc-cache -f

      # 发布产物是源码（install.sh 从 tag 对应的 tarball 安装），因此发布前必须
      # 保证这个 tag 对应的代码真的能装、能跑、能出全部图
      - name: 校验 tag 与代码里的版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^MINT_VERSION <- "\(.*\)"/\1/p' R/cli.R)"
          echo "tag=$tag  代码=$version"
          [ "$tag" = "$version" ] || { echo "::error::$GITHUB_REF_NAME 与 R/cli.R 里的 $version 不一致"; exit 1; }

      - name: 安装依赖
        run: Rscript scripts/install-deps.R
        env:
          MINT_NCPUS: 2

      - name: 测试
        run: Rscript tests/run-tests.R

      - name: 渲染全部图表示例（发布时随附）
        run: Rscript scripts/examples.R release/previews --dpi=150

      - name: 冒烟：从 tarball 安装
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/install-check"
          mkdir -p "$src"
          tar --exclude=.git --exclude=release -cf - . | tar -xf - -C "$src"
          cd "$src"
          MINT_LIB="$HOME/.local/share/mint/rlib" ./bin/mint doctor
          MINT_LIB="$HOME/.local/share/mint/rlib" ./bin/mint render bar -o "$RUNNER_TEMP/check.png"
          file "$RUNNER_TEMP/check.png"

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/previews/*.png
            release/previews/*.svg
          generate_release_notes: true
          draft: false
